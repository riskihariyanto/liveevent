<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061230">
<title>Live Chat</title>
<style>
:root {
  --bg: #061230;
  --panel: #0d1f4a;
  --panel-hi: #14306b;
  --line: #1f3a78;
  --text: #eef3ff;
  --muted: #9db0d8;
  --accent: #2563eb;
  --accent-hi: #3b82f6;
  --gold: #fbbf24;
  --danger: #f87171;
  --ok: #22c55e;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: radial-gradient(120% 80% at 50% 0%, #0b2257 0%, var(--bg) 60%);
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { overflow: hidden; }
#app {
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
  overflow-y: auto;
}
.hidden { display: none !important; }
button, textarea, input { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; }

.center {
  justify-content: center;
  align-items: stretch;
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
}
.center h1 {
  margin: 0;
  padding-bottom: 10px;
  font-size: 1.7rem;
  letter-spacing: -0.01em;
  border-bottom: 3px solid var(--gold);
  align-self: flex-start;
}
.center p { margin: 0; color: var(--muted); line-height: 1.5; }
.field {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  outline: none;
}
.field::placeholder { color: #6f86b8; }
.field:focus { border-color: var(--accent-hi); }
.field:disabled { opacity: 0.45; }
.primary {
  padding: 14px 20px;
  font-weight: 700;
  background: linear-gradient(180deg, var(--accent-hi), var(--accent));
  color: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
}
.primary:disabled { opacity: 0.45; cursor: not-allowed; }

.photo-pick { display: flex; align-items: center; gap: 14px; }
.avatar-btn {
  position: relative;
  width: 84px;
  height: 84px;
  flex: none;
  padding: 0;
  overflow: hidden;
  border-radius: 50%;
  background: var(--panel);
  border: 2px dashed var(--accent-hi);
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 600;
}
.avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-side { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.photo-side strong { font-size: 0.95rem; }
.photo-side small { color: var(--muted); line-height: 1.35; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.who .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .pic { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--accent-hi); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none; }
.dot.on { background: var(--ok); }
.link { background: none; color: var(--muted); padding: 6px 4px; font-size: 0.9rem; text-decoration: underline; }

.stagebox {
  min-height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px;
  background: rgba(13, 31, 74, 0.55);
  border: 1px dashed var(--line);
  border-radius: 16px;
}
.stagebox .pic { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid rgba(255, 255, 255, 0.85); }
.bubble {
  max-width: 100%;
  min-width: 0;
  padding: 10px 16px;
  border-radius: 18px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.bubble b { display: block; font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; }

.swatches { display: flex; justify-content: space-between; gap: 8px; }
.swatch {
  flex: 1;
  max-width: 44px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px solid transparent;
  outline: 2px solid transparent;
}
.swatch[aria-pressed="true"] { border-color: var(--bg); outline-color: #fff; }

.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea { resize: none; display: block; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.count.warn { color: var(--gold); }

.spacer { flex: 1; min-height: 0; }

.emotes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.emote {
  height: clamp(88px, 15dvh, 150px);
  font-size: clamp(3rem, 8dvh, 4.8rem);
  line-height: 1;
  background: linear-gradient(180deg, var(--panel-hi), var(--panel));
  border: 1px solid var(--line);
  border-radius: 24px;
  transition: transform 0.08s ease, background-color 0.08s ease;
}
.emote:active { transform: scale(0.93); border-color: var(--gold); }
.emote:disabled { opacity: 0.35; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translate(-50%, 20px);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  background: var(--panel-hi);
  border: 1px solid var(--accent-hi);
  border-radius: 12px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.notice {
  padding: 10px 14px;
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.45);
  border-radius: 12px;
  color: #fcd34d;
  font-size: 0.9rem;
  line-height: 1.4;
}

@media (max-height: 700px) {
  .stagebox { min-height: 64px; }
  .emote { height: 80px; font-size: 2.8rem; }
}
</style>
</head>
<body>
<main id="app">
  <section id="screenJoin" class="screen center hidden">
    <h1>Gabung Live Chat</h1>
    <p>Pilih nama samaran dan foto kecil kalau mau. Tanpa daftar, tanpa email.</p>
    <div class="photo-pick">
      <button id="photoBtn" class="avatar-btn" type="button" onclick="openPhoto()" aria-label="Pilih foto profil"><span id="photoHint">+ Foto</span><img id="joinPhoto" class="hidden" alt=""></button>
      <div class="photo-side">
        <strong>Foto profil (opsional)</strong>
        <small>Dikecilkan otomatis sebelum dikirim.</small>
        <button id="photoClear" class="link hidden" type="button" onclick="clearPhoto()">Hapus foto</button>
      </div>
      <input id="photoInput" class="hidden" type="file" accept="image/*" onchange="handlePhoto(this)">
    </div>
    <input id="nickInput" class="field" type="text" autocomplete="off" autocapitalize="words" placeholder="Nickname kamu" aria-label="Nickname">
    <button class="primary" onclick="submitNickname()">Masuk</button>
  </section>

  <section id="screenChat" class="screen hidden">
    <div class="top">
      <div class="who"><span id="dot" class="dot"></span><img id="whoPhoto" class="pic hidden" alt=""><span id="whoName" class="name"></span></div>
      <button class="link" onclick="changeNickname()">Ubah profil</button>
    </div>
    <div id="notice" class="notice hidden"></div>
    <div class="stagebox">
      <img id="bubblePhoto" class="pic hidden" alt="">
      <div id="bubble" class="bubble"><b id="bubbleName"></b><span id="bubbleText"></span></div>
    </div>
    <div id="swatches" class="swatches" role="group" aria-label="Warna gelembung"></div>
    <div class="composer">
      <textarea id="msg" class="field" rows="2" placeholder="Tulis pesan singkat…" aria-label="Pesan" oninput="handleInput()"></textarea>
      <div class="row">
        <span id="count" class="count">0/150</span>
        <button id="sendBtn" class="primary" onclick="sendChat()" disabled>Kirim</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="emotes">
      <button class="emote" onclick="sendEmote('heart', this)" aria-label="Kirim reaksi hati">❤️</button>
      <button class="emote" onclick="sendEmote('fire', this)" aria-label="Kirim reaksi api">🔥</button>
      <button class="emote" onclick="sendEmote('clap', this)" aria-label="Kirim reaksi tepuk tangan">👏</button>
      <button class="emote" onclick="sendEmote('laugh', this)" aria-label="Kirim reaksi tertawa">😂</button>
    </div>
  </section>

  <section id="screenBanned" class="screen center hidden">
    <h1>Akses dibatasi</h1>
    <p>Moderator menonaktifkan pengiriman pesan dari perangkat ini selama acara berlangsung.</p>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import {
  auth, db, signInAnonymously, onAuthStateChanged,
  doc, collection, onSnapshot, writeBatch, setDoc, serverTimestamp
} from './firebase.js';
import { MAX_TEXT, MAX_NICK, COLORS, EMOTES, textOn, cleanText, clip, buildCensor } from './common.js';

const COOLDOWN_MS = 3200;
const SEND_TIMEOUT_MS = 10000;
const FLUSH_GAP_MS = 2000;
const TAP_CAP = 300;
const TAP_PER_FLUSH = 12;
const KEY_NICK = 'lec.nick';
const KEY_COLOR = 'lec.color';
const KEY_PHOTO = 'lec.photo';
const PHOTO_SIZES = [96, 72, 56];
const PHOTO_QUALITIES = [0.72, 0.55, 0.4];
const PHOTO_MAX_CHARS = 11000;
const PLACEHOLDER_CHAT = 'Tulis pesan singkat…';

const store = {
  get(key) {
    try { return localStorage.getItem(key); } catch (err) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); } catch (err) {}
  }
};

const session = {
  uid: '',
  nickname: '',
  color: COLORS[5],
  mode: 'auto',
  phase: 'full',
  photo: '',
  ready: false,
  chatOn: true,
  emotesOn: true,
  banned: false,
  online: false,
  sending: false,
  cooldownUntil: 0,
  cooldownTimer: 0,
  toastTimer: 0,
  censor: (text) => text,
  taps: {},
  tapTimer: 0,
  tapTotal: 0,
  lastFlush: 0,
  signingIn: false,
  attached: false
};

const els = {
  join: document.getElementById('screenJoin'),
  chat: document.getElementById('screenChat'),
  banned: document.getElementById('screenBanned'),
  nickInput: document.getElementById('nickInput'),
  dot: document.getElementById('dot'),
  whoName: document.getElementById('whoName'),
  notice: document.getElementById('notice'),
  bubble: document.getElementById('bubble'),
  bubbleName: document.getElementById('bubbleName'),
  bubbleText: document.getElementById('bubbleText'),
  swatches: document.getElementById('swatches'),
  msg: document.getElementById('msg'),
  count: document.getElementById('count'),
  sendBtn: document.getElementById('sendBtn'),
  toast: document.getElementById('toast'),
  photoHint: document.getElementById('photoHint'),
  joinPhoto: document.getElementById('joinPhoto'),
  photoClear: document.getElementById('photoClear'),
  photoInput: document.getElementById('photoInput'),
  whoPhoto: document.getElementById('whoPhoto'),
  bubblePhoto: document.getElementById('bubblePhoto'),
  emotes: document.querySelectorAll('.emote')
};

function showScreen(name) {
  els.join.classList.toggle('hidden', name !== 'join');
  els.chat.classList.toggle('hidden', name !== 'chat');
  els.banned.classList.toggle('hidden', name !== 'banned');
  if (name === 'join') {
    els.nickInput.value = session.nickname;
    els.nickInput.focus();
  }
}

function toast(message) {
  els.toast.textContent = message;
  els.toast.classList.add('show');
  clearTimeout(session.toastTimer);
  session.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2800);
}

function renderStatus() {
  els.dot.classList.toggle('on', session.online);
  els.dot.title = session.online ? 'Terhubung' : 'Menyambung ulang…';
}

function renderPhoto() {
  const has = Boolean(session.photo);
  [els.joinPhoto, els.whoPhoto, els.bubblePhoto].forEach((node) => {
    if (has) node.src = session.photo;
    node.classList.toggle('hidden', !has);
  });
  els.photoHint.classList.toggle('hidden', has);
  els.photoClear.classList.toggle('hidden', !has);
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('image'));
    };
    img.src = url;
  });
}

async function compressPhoto(file) {
  const img = await loadImage(file);
  const side = Math.min(img.naturalWidth, img.naturalHeight);
  if (!side) return '';
  const sx = (img.naturalWidth - side) / 2;
  const sy = (img.naturalHeight - side) / 2;
  for (const size of PHOTO_SIZES) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
    for (const quality of PHOTO_QUALITIES) {
      const url = canvas.toDataURL('image/jpeg', quality);
      if (url.length <= PHOTO_MAX_CHARS) return url;
    }
  }
  return '';
}

function openPhoto() {
  els.photoInput.click();
}

async function handlePhoto(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (file.type.indexOf('image/') !== 0) {
    toast('Pilih file gambar ya.');
    return;
  }
  try {
    const url = await compressPhoto(file);
    if (!url) {
      toast('Foto tidak bisa dikecilkan. Coba foto lain.');
      return;
    }
    session.photo = url;
    store.set(KEY_PHOTO, url);
    renderPhoto();
  } catch (err) {
    toast('Foto tidak bisa dibaca. Coba foto lain.');
  }
}

function clearPhoto() {
  session.photo = '';
  store.set(KEY_PHOTO, '');
  renderPhoto();
}

function renderBubble() {
  const text = els.msg.value.replace(/\s+/g, ' ').trim();
  els.bubble.style.backgroundColor = session.color;
  els.bubble.style.color = textOn(session.color);
  els.bubbleName.textContent = session.nickname;
  els.bubbleText.textContent = text || 'Pratinjau pesanmu';
}

function renderSwatches() {
  els.swatches.querySelectorAll('.swatch').forEach((node) => {
    node.setAttribute('aria-pressed', String(node.dataset.color === session.color));
  });
}

function buildSwatches() {
  COLORS.forEach((hex) => {
    const node = document.createElement('button');
    node.className = 'swatch';
    node.dataset.color = hex;
    node.style.backgroundColor = hex;
    node.setAttribute('aria-label', 'Warna ' + hex);
    node.setAttribute('onclick', "pickColor('" + hex + "')");
    els.swatches.appendChild(node);
  });
}

function pickColor(hex) {
  if (COLORS.indexOf(hex) === -1) return;
  session.color = hex;
  store.set(KEY_COLOR, hex);
  renderSwatches();
  renderBubble();
}

function cooldownLeft() {
  return Math.max(0, session.cooldownUntil - Date.now());
}

function canSend() {
  return Boolean(session.uid) && session.ready && session.chatOn && !session.banned && !session.sending && cooldownLeft() === 0;
}

function updateSendButton() {
  const left = cooldownLeft();
  const empty = !els.msg.value.replace(/\s+/g, ' ').trim();
  els.sendBtn.disabled = !canSend() || empty;
  els.sendBtn.textContent = left > 0 ? 'Tunggu ' + Math.ceil(left / 1000) + 's' : 'Kirim';
}

function startCooldown(ms) {
  session.cooldownUntil = Date.now() + ms;
  clearInterval(session.cooldownTimer);
  session.cooldownTimer = setInterval(() => {
    if (cooldownLeft() === 0) clearInterval(session.cooldownTimer);
    updateSendButton();
  }, 250);
  updateSendButton();
}

function noticeText() {
  if (!session.ready) return 'Acara belum dimulai. Tunggu moderator membuka sesi.';
  if (session.phase === 'off') return 'Sesi sedang dijeda. Chat dan reaksi dinonaktifkan sementara.';
  if (session.phase === 'emote') return 'Chat dinonaktifkan sementara. Kamu masih bisa kirim reaksi.';
  return '';
}

function refreshControls() {
  const message = noticeText();
  els.notice.textContent = message;
  els.notice.classList.toggle('hidden', !message);
  const off = !session.ready || session.banned || !session.emotesOn;
  els.emotes.forEach((button) => { button.disabled = off; });
  const chatOff = !session.ready || !session.chatOn;
  els.msg.disabled = chatOff;
  els.msg.placeholder = chatOff ? 'Chat sedang dinonaktifkan' : PLACEHOLDER_CHAT;
  renderStatus();
  updateSendButton();
}

function handleInput() {
  const trimmed = clip(els.msg.value, MAX_TEXT);
  if (trimmed !== els.msg.value) els.msg.value = trimmed;
  const length = Array.from(trimmed).length;
  els.count.textContent = length + '/' + MAX_TEXT;
  els.count.classList.toggle('warn', length >= MAX_TEXT - 10);
  renderBubble();
  updateSendButton();
}

function setBanned(flag) {
  if (session.banned === flag) return;
  session.banned = flag;
  if (flag) showScreen('banned');
  else showScreen(session.nickname ? 'chat' : 'join');
  refreshControls();
}

function enterChat() {
  els.whoName.textContent = session.nickname;
  showScreen(session.banned ? 'banned' : 'chat');
  renderBubble();
  refreshControls();
}

function submitNickname() {
  const nick = cleanText(els.nickInput.value, MAX_NICK);
  if (!nick) {
    toast('Isi nickname dulu ya.');
    els.nickInput.focus();
    return;
  }
  session.nickname = nick;
  store.set(KEY_NICK, nick);
  enterChat();
}

function changeNickname() {
  showScreen('join');
}

async function sendChat() {
  if (!canSend()) return;
  const text = cleanText(els.msg.value, MAX_TEXT);
  if (!text) return;

  const safeText = clip(session.censor(text), 300);
  const safeNick = clip(session.censor(session.nickname), 40);
  const target = session.mode === 'manual' ? 'pending' : 'approved';

  session.sending = true;
  updateSendButton();
  try {
    const batch = writeBatch(db);
    batch.set(doc(db, 'users', session.uid), { lastChat: serverTimestamp() });
    const payload = {
      uid: session.uid,
      nickname: safeNick,
      text: safeText,
      color: session.color,
      ts: serverTimestamp()
    };
    if (session.photo) payload.photo = session.photo;
    batch.set(doc(collection(db, target)), payload);
    const commit = batch.commit();
    commit.catch(() => {});
    const outcome = await Promise.race([
      commit.then(() => 'ok'),
      new Promise((resolve) => setTimeout(() => resolve('slow'), SEND_TIMEOUT_MS))
    ]);
    els.msg.value = '';
    handleInput();
    startCooldown(COOLDOWN_MS);
    if (outcome === 'slow') toast('Koneksi lambat. Pesan akan terkirim saat tersambung.');
    else toast(target === 'pending' ? 'Terkirim. Menunggu persetujuan moderator.' : 'Pesan terkirim ke layar!');
  } catch (err) {
    startCooldown(1500);
    if (err && err.code === 'permission-denied') toast('Pesan ditolak. Tunggu beberapa detik lalu coba lagi.');
    else toast('Gagal mengirim. Periksa koneksi internet.');
  } finally {
    session.sending = false;
    updateSendButton();
  }
}

function flushTaps() {
  session.tapTimer = 0;
  const counts = {};
  let any = false;
  Object.keys(session.taps).forEach((key) => {
    if (session.taps[key] > 0) {
      counts[key] = session.taps[key];
      any = true;
    }
  });
  session.taps = {};
  if (!any || !session.uid || session.banned) return;
  session.lastFlush = Date.now();
  setDoc(doc(db, 'emotes', session.uid), { uid: session.uid, counts, ts: serverTimestamp() }).catch(() => {});
}

function scheduleFlush() {
  if (session.tapTimer) return;
  const wait = Math.max(250, session.lastFlush + FLUSH_GAP_MS - Date.now());
  session.tapTimer = setTimeout(flushTaps, wait);
}

function sendEmote(key, button) {
  if (!session.uid || !session.ready || session.banned || !session.emotesOn) return;
  if (!Object.prototype.hasOwnProperty.call(EMOTES, key)) return;
  if (session.tapTotal >= TAP_CAP) {
    toast('Batas reaksi tercapai. Kirim pesan teks saja ya.');
    return;
  }
  session.tapTotal += 1;
  session.taps[key] = Math.min(TAP_PER_FLUSH, (session.taps[key] || 0) + 1);
  if (button && navigator.vibrate) navigator.vibrate(8);
  scheduleFlush();
}

function attach() {
  if (session.attached) return;
  session.attached = true;

  onSnapshot(doc(db, 'config', 'state'), { includeMetadataChanges: true }, (snap) => {
    session.online = !snap.metadata.fromCache;
    if (snap.exists()) {
      const data = snap.data();
      session.ready = true;
      session.mode = data.mode === 'manual' ? 'manual' : 'auto';
      session.phase = data.phase === 'off' || data.phase === 'emote' ? data.phase : 'full';
      session.chatOn = session.phase === 'full';
      session.emotesOn = session.phase !== 'off';
      if (!session.emotesOn) session.taps = {};
      session.censor = buildCensor(data.words);
    } else {
      session.ready = false;
    }
    refreshControls();
  }, () => {
    session.online = false;
    refreshControls();
  });

  onSnapshot(doc(db, 'banned', session.uid), (snap) => {
    setBanned(snap.exists());
  }, () => {});
}

els.nickInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') submitNickname();
});

els.msg.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendChat();
  }
});

window.submitNickname = submitNickname;
window.changeNickname = changeNickname;
window.sendChat = sendChat;
window.sendEmote = sendEmote;
window.pickColor = pickColor;
window.handleInput = handleInput;
window.openPhoto = openPhoto;
window.handlePhoto = handlePhoto;
window.clearPhoto = clearPhoto;

onAuthStateChanged(auth, (user) => {
  if (user) {
    session.uid = user.uid;
    attach();
    refreshControls();
    return;
  }
  if (session.signingIn) return;
  session.signingIn = true;
  signInAnonymously(auth).catch(() => {
    session.signingIn = false;
    toast('Tidak bisa terhubung. Muat ulang halaman.');
  });
});

const savedColor = store.get(KEY_COLOR);
if (savedColor && COLORS.indexOf(savedColor) !== -1) session.color = savedColor;
const savedPhoto = store.get(KEY_PHOTO);
if (savedPhoto && savedPhoto.indexOf('data:image/jpeg;base64,') === 0 && savedPhoto.length <= PHOTO_MAX_CHARS) session.photo = savedPhoto;
buildSwatches();
renderSwatches();
renderPhoto();
renderStatus();

const savedNick = store.get(KEY_NICK);
if (savedNick) {
  session.nickname = cleanText(savedNick, MAX_NICK);
  enterChat();
} else {
  showScreen('join');
}
</script>
</body>
</html>
