<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Live Chat</title>
<style>
:root {
  --bg: #0b0d12;
  --panel: #151922;
  --line: #232938;
  --text: #f2f4f8;
  --muted: #8b93a7;
  --accent: #3b82f6;
  --danger: #ef4444;
  --ok: #22c55e;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { overflow: hidden; }
#app {
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
}
.hidden { display: none !important; }
button, textarea, input { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; }

.center {
  justify-content: center;
  align-items: stretch;
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
}
.center h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
.center p { margin: 0; color: var(--muted); line-height: 1.5; }
.field {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  outline: none;
}
.field:focus { border-color: var(--accent); }
.primary {
  padding: 14px 20px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  border-radius: 14px;
}
.primary:disabled { opacity: 0.45; cursor: not-allowed; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none; }
.dot.on { background: var(--ok); }
.link { background: none; color: var(--muted); padding: 6px 4px; font-size: 0.9rem; text-decoration: underline; }

.stagebox {
  min-height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border: 1px dashed var(--line);
  border-radius: 16px;
}
.bubble {
  max-width: 100%;
  padding: 10px 16px;
  border-radius: 18px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.bubble b { display: block; font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; }

.swatches { display: flex; justify-content: space-between; gap: 8px; }
.swatch {
  flex: 1;
  max-width: 44px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px solid transparent;
  outline: 2px solid transparent;
}
.swatch[aria-pressed="true"] { border-color: var(--bg); outline-color: #fff; }

.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea { resize: none; display: block; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.count.warn { color: var(--danger); }

.spacer { flex: 1; min-height: 0; }

.emotes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.emote {
  aspect-ratio: 1;
  font-size: 2.1rem;
  line-height: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  transition: transform 0.08s ease;
}
.emote:active { transform: scale(0.9); }
.emote:disabled { opacity: 0.4; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translate(-50%, 20px);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  background: #1f2636;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-height: 640px) {
  .stagebox { min-height: 64px; }
  .emote { font-size: 1.7rem; }
}
.notice {
  padding: 10px 14px;
  background: #2a2412;
  border: 1px solid #6b5a1a;
  border-radius: 12px;
  color: #fbbf24;
  font-size: 0.9rem;
}
</style>
</head>
<body>
<main id="app">
  <section id="screenJoin" class="screen center hidden">
    <h1>Gabung Live Chat</h1>
    <p>Pilih nama samaran. Tanpa daftar, tanpa email.</p>
    <input id="nickInput" class="field" type="text" autocomplete="off" autocapitalize="words" placeholder="Nickname kamu" aria-label="Nickname">
    <button class="primary" onclick="submitNickname()">Masuk</button>
  </section>

  <section id="screenChat" class="screen hidden">
    <div class="top">
      <div class="who"><span id="dot" class="dot"></span><span id="whoName"></span></div>
      <button class="link" onclick="changeNickname()">Ganti nama</button>
    </div>
    <div id="notice" class="notice hidden">Acara belum dimulai. Tunggu moderator membuka sesi.</div>
    <div class="stagebox">
      <div id="bubble" class="bubble"><b id="bubbleName"></b><span id="bubbleText"></span></div>
    </div>
    <div id="swatches" class="swatches" role="group" aria-label="Warna gelembung"></div>
    <div class="composer">
      <textarea id="msg" class="field" rows="2" placeholder="Tulis pesan singkat…" aria-label="Pesan" oninput="handleInput()"></textarea>
      <div class="row">
        <span id="count" class="count">0/150</span>
        <button id="sendBtn" class="primary" onclick="sendChat()" disabled>Kirim</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="emotes">
      <button class="emote" onclick="sendEmote('heart', this)" aria-label="Kirim reaksi hati">❤️</button>
      <button class="emote" onclick="sendEmote('fire', this)" aria-label="Kirim reaksi api">🔥</button>
      <button class="emote" onclick="sendEmote('clap', this)" aria-label="Kirim reaksi tepuk tangan">👏</button>
      <button class="emote" onclick="sendEmote('laugh', this)" aria-label="Kirim reaksi tertawa">😂</button>
    </div>
  </section>

  <section id="screenBanned" class="screen center hidden">
    <h1>Akses dibatasi</h1>
    <p>Moderator menonaktifkan pengiriman pesan dari perangkat ini selama acara berlangsung.</p>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import {
  auth, db, signInAnonymously, onAuthStateChanged,
  doc, collection, onSnapshot, writeBatch, setDoc, serverTimestamp
} from './firebase.js';
import { MAX_TEXT, MAX_NICK, COLORS, EMOTES, textOn, cleanText, clip, buildCensor } from './common.js';

const COOLDOWN_MS = 3200;
const SEND_TIMEOUT_MS = 10000;
const FLUSH_GAP_MS = 2000;
const TAP_CAP = 300;
const TAP_PER_FLUSH = 12;
const KEY_NICK = 'lec.nick';
const KEY_COLOR = 'lec.color';

const store = {
  get(key) {
    try { return localStorage.getItem(key); } catch (err) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); } catch (err) {}
  }
};

const session = {
  uid: '',
  nickname: '',
  color: COLORS[5],
  mode: 'auto',
  ready: false,
  emotesOn: true,
  banned: false,
  online: false,
  sending: false,
  cooldownUntil: 0,
  cooldownTimer: 0,
  toastTimer: 0,
  censor: (text) => text,
  taps: {},
  tapTimer: 0,
  tapTotal: 0,
  lastFlush: 0,
  signingIn: false,
  attached: false
};

const els = {
  join: document.getElementById('screenJoin'),
  chat: document.getElementById('screenChat'),
  banned: document.getElementById('screenBanned'),
  nickInput: document.getElementById('nickInput'),
  dot: document.getElementById('dot'),
  whoName: document.getElementById('whoName'),
  notice: document.getElementById('notice'),
  bubble: document.getElementById('bubble'),
  bubbleName: document.getElementById('bubbleName'),
  bubbleText: document.getElementById('bubbleText'),
  swatches: document.getElementById('swatches'),
  msg: document.getElementById('msg'),
  count: document.getElementById('count'),
  sendBtn: document.getElementById('sendBtn'),
  toast: document.getElementById('toast'),
  emotes: document.querySelectorAll('.emote')
};

function showScreen(name) {
  els.join.classList.toggle('hidden', name !== 'join');
  els.chat.classList.toggle('hidden', name !== 'chat');
  els.banned.classList.toggle('hidden', name !== 'banned');
  if (name === 'join') {
    els.nickInput.value = session.nickname;
    els.nickInput.focus();
  }
}

function toast(message) {
  els.toast.textContent = message;
  els.toast.classList.add('show');
  clearTimeout(session.toastTimer);
  session.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2800);
}

function renderStatus() {
  els.dot.classList.toggle('on', session.online);
  els.dot.title = session.online ? 'Terhubung' : 'Menyambung ulang…';
}

function renderBubble() {
  const text = els.msg.value.replace(/\s+/g, ' ').trim();
  els.bubble.style.backgroundColor = session.color;
  els.bubble.style.color = textOn(session.color);
  els.bubbleName.textContent = session.nickname;
  els.bubbleText.textContent = text || 'Pratinjau pesanmu';
}

function renderSwatches() {
  els.swatches.querySelectorAll('.swatch').forEach((node) => {
    node.setAttribute('aria-pressed', String(node.dataset.color === session.color));
  });
}

function buildSwatches() {
  COLORS.forEach((hex) => {
    const node = document.createElement('button');
    node.className = 'swatch';
    node.dataset.color = hex;
    node.style.backgroundColor = hex;
    node.setAttribute('aria-label', 'Warna ' + hex);
    node.setAttribute('onclick', "pickColor('" + hex + "')");
    els.swatches.appendChild(node);
  });
}

function pickColor(hex) {
  if (COLORS.indexOf(hex) === -1) return;
  session.color = hex;
  store.set(KEY_COLOR, hex);
  renderSwatches();
  renderBubble();
}

function cooldownLeft() {
  return Math.max(0, session.cooldownUntil - Date.now());
}

function canSend() {
  return Boolean(session.uid) && session.ready && !session.banned && !session.sending && cooldownLeft() === 0;
}

function updateSendButton() {
  const left = cooldownLeft();
  const empty = !els.msg.value.replace(/\s+/g, ' ').trim();
  els.sendBtn.disabled = !canSend() || empty;
  els.sendBtn.textContent = left > 0 ? 'Tunggu ' + Math.ceil(left / 1000) + 's' : 'Kirim';
}

function startCooldown(ms) {
  session.cooldownUntil = Date.now() + ms;
  clearInterval(session.cooldownTimer);
  session.cooldownTimer = setInterval(() => {
    if (cooldownLeft() === 0) clearInterval(session.cooldownTimer);
    updateSendButton();
  }, 250);
  updateSendButton();
}

function refreshControls() {
  els.notice.classList.toggle('hidden', session.ready);
  const off = !session.ready || session.banned || !session.emotesOn;
  els.emotes.forEach((button) => { button.disabled = off; });
  renderStatus();
  updateSendButton();
}

function handleInput() {
  const trimmed = clip(els.msg.value, MAX_TEXT);
  if (trimmed !== els.msg.value) els.msg.value = trimmed;
  const length = Array.from(trimmed).length;
  els.count.textContent = length + '/' + MAX_TEXT;
  els.count.classList.toggle('warn', length >= MAX_TEXT - 10);
  renderBubble();
  updateSendButton();
}

function setBanned(flag) {
  if (session.banned === flag) return;
  session.banned = flag;
  if (flag) showScreen('banned');
  else showScreen(session.nickname ? 'chat' : 'join');
  refreshControls();
}

function enterChat() {
  els.whoName.textContent = session.nickname;
  showScreen(session.banned ? 'banned' : 'chat');
  renderBubble();
  refreshControls();
}

function submitNickname() {
  const nick = cleanText(els.nickInput.value, MAX_NICK);
  if (!nick) {
    toast('Isi nickname dulu ya.');
    els.nickInput.focus();
    return;
  }
  session.nickname = nick;
  store.set(KEY_NICK, nick);
  enterChat();
}

function changeNickname() {
  showScreen('join');
}

async function sendChat() {
  if (!canSend()) return;
  const text = cleanText(els.msg.value, MAX_TEXT);
  if (!text) return;

  const safeText = clip(session.censor(text), 300);
  const safeNick = clip(session.censor(session.nickname), 40);
  const target = session.mode === 'manual' ? 'pending' : 'approved';

  session.sending = true;
  updateSendButton();
  try {
    const batch = writeBatch(db);
    batch.set(doc(db, 'users', session.uid), { lastChat: serverTimestamp() });
    batch.set(doc(collection(db, target)), {
      uid: session.uid,
      nickname: safeNick,
      text: safeText,
      color: session.color,
      ts: serverTimestamp()
    });
    const commit = batch.commit();
    commit.catch(() => {});
    const outcome = await Promise.race([
      commit.then(() => 'ok'),
      new Promise((resolve) => setTimeout(() => resolve('slow'), SEND_TIMEOUT_MS))
    ]);
    els.msg.value = '';
    handleInput();
    startCooldown(COOLDOWN_MS);
    if (outcome === 'slow') toast('Koneksi lambat. Pesan akan terkirim saat tersambung.');
    else toast(target === 'pending' ? 'Terkirim. Menunggu persetujuan moderator.' : 'Pesan terkirim ke layar!');
  } catch (err) {
    startCooldown(1500);
    if (err && err.code === 'permission-denied') toast('Pesan ditolak. Tunggu beberapa detik lalu coba lagi.');
    else toast('Gagal mengirim. Periksa koneksi internet.');
  } finally {
    session.sending = false;
    updateSendButton();
  }
}

function flushTaps() {
  session.tapTimer = 0;
  const counts = {};
  let any = false;
  Object.keys(session.taps).forEach((key) => {
    if (session.taps[key] > 0) {
      counts[key] = session.taps[key];
      any = true;
    }
  });
  session.taps = {};
  if (!any || !session.uid || session.banned) return;
  session.lastFlush = Date.now();
  setDoc(doc(db, 'emotes', session.uid), { uid: session.uid, counts, ts: serverTimestamp() }).catch(() => {});
}

function scheduleFlush() {
  if (session.tapTimer) return;
  const wait = Math.max(250, session.lastFlush + FLUSH_GAP_MS - Date.now());
  session.tapTimer = setTimeout(flushTaps, wait);
}

function sendEmote(key, button) {
  if (!session.uid || !session.ready || session.banned || !session.emotesOn) return;
  if (!Object.prototype.hasOwnProperty.call(EMOTES, key)) return;
  if (session.tapTotal >= TAP_CAP) {
    toast('Batas reaksi tercapai. Kirim pesan teks saja ya.');
    return;
  }
  session.tapTotal += 1;
  session.taps[key] = Math.min(TAP_PER_FLUSH, (session.taps[key] || 0) + 1);
  if (button && navigator.vibrate) navigator.vibrate(8);
  scheduleFlush();
}

function attach() {
  if (session.attached) return;
  session.attached = true;

  onSnapshot(doc(db, 'config', 'state'), { includeMetadataChanges: true }, (snap) => {
    session.online = !snap.metadata.fromCache;
    if (snap.exists()) {
      const data = snap.data();
      session.ready = true;
      session.mode = data.mode === 'manual' ? 'manual' : 'auto';
      session.emotesOn = data.emotes !== false;
      session.censor = buildCensor(data.words);
    } else {
      session.ready = false;
    }
    refreshControls();
  }, () => {
    session.online = false;
    refreshControls();
  });

  onSnapshot(doc(db, 'banned', session.uid), (snap) => {
    setBanned(snap.exists());
  }, () => {});
}

els.nickInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') submitNickname();
});

els.msg.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendChat();
  }
});

window.submitNickname = submitNickname;
window.changeNickname = changeNickname;
window.sendChat = sendChat;
window.sendEmote = sendEmote;
window.pickColor = pickColor;
window.handleInput = handleInput;

onAuthStateChanged(auth, (user) => {
  if (user) {
    session.uid = user.uid;
    attach();
    refreshControls();
    return;
  }
  if (session.signingIn) return;
  session.signingIn = true;
  signInAnonymously(auth).catch(() => {
    session.signingIn = false;
    toast('Tidak bisa terhubung. Muat ulang halaman.');
  });
});

const savedColor = store.get(KEY_COLOR);
if (savedColor && COLORS.indexOf(savedColor) !== -1) session.color = savedColor;
buildSwatches();
renderSwatches();
renderStatus();

const savedNick = store.get(KEY_NICK);
if (savedNick) {
  session.nickname = cleanText(savedNick, MAX_NICK);
  enterChat();
} else {
  showScreen('join');
}
</script>
</body>
</html>
