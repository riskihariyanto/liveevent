<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Live Chat</title>
<style>
:root {
  --bg: #0b0d12;
  --panel: #151922;
  --line: #232938;
  --text: #f2f4f8;
  --muted: #8b93a7;
  --accent: #3b82f6;
  --danger: #ef4444;
  --ok: #22c55e;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body { overflow: hidden; }
#app {
  height: 100vh;
  height: 100dvh;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 14px;
}
.hidden { display: none !important; }
button, textarea, input { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; }

.center {
  justify-content: center;
  align-items: stretch;
  max-width: 420px;
  width: 100%;
  margin: 0 auto;
}
.center h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.01em; }
.center p { margin: 0; color: var(--muted); line-height: 1.5; }
.field {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  outline: none;
}
.field:focus { border-color: var(--accent); }
.primary {
  padding: 14px 20px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  border-radius: 14px;
}
.primary:disabled { opacity: 0.45; cursor: not-allowed; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.who { display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600; }
.who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); flex: none; }
.dot.on { background: var(--ok); }
.link { background: none; color: var(--muted); padding: 6px 4px; font-size: 0.9rem; text-decoration: underline; }

.stagebox {
  min-height: 84px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  border: 1px dashed var(--line);
  border-radius: 16px;
}
.bubble {
  max-width: 100%;
  padding: 10px 16px;
  border-radius: 18px;
  line-height: 1.35;
  overflow-wrap: anywhere;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.bubble b { display: block; font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; }

.swatches { display: flex; justify-content: space-between; gap: 8px; }
.swatch {
  flex: 1;
  max-width: 44px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px solid transparent;
  outline: 2px solid transparent;
}
.swatch[aria-pressed="true"] { border-color: var(--bg); outline-color: #fff; }

.composer { display: flex; flex-direction: column; gap: 8px; }
.composer textarea { resize: none; display: block; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.count.warn { color: var(--danger); }

.spacer { flex: 1; min-height: 0; }

.emotes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.emote {
  aspect-ratio: 1;
  font-size: 2.1rem;
  line-height: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  transition: transform 0.08s ease;
}
.emote:active { transform: scale(0.9); }
.emote:disabled { opacity: 0.4; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translate(-50%, 20px);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  background: #1f2636;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 10;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-height: 640px) {
  .stagebox { min-height: 64px; }
  .emote { font-size: 1.7rem; }
}
</style>
</head>
<body>
<main id="app">
  <section id="screenJoin" class="screen center hidden">
    <h1>Gabung Live Chat</h1>
    <p>Pilih nama samaran. Tanpa daftar, tanpa email.</p>
    <input id="nickInput" class="field" type="text" autocomplete="off" autocapitalize="words" placeholder="Nickname kamu" aria-label="Nickname">
    <button class="primary" onclick="submitNickname()">Masuk</button>
  </section>

  <section id="screenChat" class="screen hidden">
    <div class="top">
      <div class="who"><span id="dot" class="dot"></span><span id="whoName"></span></div>
      <button class="link" onclick="changeNickname()">Ganti nama</button>
    </div>
    <div class="stagebox">
      <div id="bubble" class="bubble"><b id="bubbleName"></b><span id="bubbleText"></span></div>
    </div>
    <div id="swatches" class="swatches" role="group" aria-label="Warna gelembung"></div>
    <div class="composer">
      <textarea id="msg" class="field" rows="2" placeholder="Tulis pesan singkat…" aria-label="Pesan" oninput="handleInput()"></textarea>
      <div class="row">
        <span id="count" class="count">0/150</span>
        <button id="sendBtn" class="primary" onclick="sendChat()" disabled>Kirim</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="emotes">
      <button class="emote" onclick="sendEmote('❤️', this)" aria-label="Kirim reaksi hati">❤️</button>
      <button class="emote" onclick="sendEmote('🔥', this)" aria-label="Kirim reaksi api">🔥</button>
      <button class="emote" onclick="sendEmote('👏', this)" aria-label="Kirim reaksi tepuk tangan">👏</button>
      <button class="emote" onclick="sendEmote('😂', this)" aria-label="Kirim reaksi tertawa">😂</button>
    </div>
  </section>

  <section id="screenBanned" class="screen center hidden">
    <h1>Akses dibatasi</h1>
    <p>Moderator menonaktifkan pengiriman pesan dari perangkat ini selama acara berlangsung.</p>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const MAX_TEXT = 150;
const MAX_NICK = 20;
const EMOTE_GAP_MS = 90;
const SEND_TIMEOUT_MS = 4000;
const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7', '#ec4899'];
const KEY_DEVICE = 'lec.device';
const KEY_NICK = 'lec.nick';
const KEY_COLOR = 'lec.color';

const store = {
  get(key) {
    try { return localStorage.getItem(key); } catch (err) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); } catch (err) {}
  }
};

const session = {
  deviceId: '',
  nickname: '',
  color: COLORS[5],
  socket: null,
  open: false,
  joined: false,
  banned: false,
  sending: false,
  retry: 0,
  retryTimer: 0,
  cooldownUntil: 0,
  cooldownTimer: 0,
  sendTimer: 0,
  toastTimer: 0,
  lastEmote: 0
};

const els = {
  join: document.getElementById('screenJoin'),
  chat: document.getElementById('screenChat'),
  banned: document.getElementById('screenBanned'),
  nickInput: document.getElementById('nickInput'),
  dot: document.getElementById('dot'),
  whoName: document.getElementById('whoName'),
  bubble: document.getElementById('bubble'),
  bubbleName: document.getElementById('bubbleName'),
  bubbleText: document.getElementById('bubbleText'),
  swatches: document.getElementById('swatches'),
  msg: document.getElementById('msg'),
  count: document.getElementById('count'),
  sendBtn: document.getElementById('sendBtn'),
  toast: document.getElementById('toast')
};

function createDeviceId() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
}

function limit(value, max) {
  return Array.from(value).slice(0, max).join('');
}

function textOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0b0d12' : '#ffffff';
}

function showScreen(name) {
  els.join.classList.toggle('hidden', name !== 'join');
  els.chat.classList.toggle('hidden', name !== 'chat');
  els.banned.classList.toggle('hidden', name !== 'banned');
  if (name === 'join') {
    els.nickInput.value = session.nickname;
    els.nickInput.focus();
  }
}

function toast(message) {
  els.toast.textContent = message;
  els.toast.classList.add('show');
  clearTimeout(session.toastTimer);
  session.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
}

function setStatus(online) {
  els.dot.classList.toggle('on', online);
  els.dot.title = online ? 'Terhubung' : 'Menyambung ulang…';
}

function renderBubble() {
  const text = els.msg.value.replace(/\s+/g, ' ').trim();
  els.bubble.style.backgroundColor = session.color;
  els.bubble.style.color = textOn(session.color);
  els.bubbleName.textContent = session.nickname;
  els.bubbleText.textContent = text || 'Pratinjau pesanmu';
}

function renderSwatches() {
  els.swatches.querySelectorAll('.swatch').forEach((node) => {
    node.setAttribute('aria-pressed', String(node.dataset.color === session.color));
  });
}

function buildSwatches() {
  COLORS.forEach((hex) => {
    const node = document.createElement('button');
    node.className = 'swatch';
    node.dataset.color = hex;
    node.style.backgroundColor = hex;
    node.setAttribute('aria-label', 'Warna ' + hex);
    node.setAttribute('onclick', "pickColor('" + hex + "')");
    els.swatches.appendChild(node);
  });
}

function pickColor(hex) {
  if (COLORS.indexOf(hex) === -1) return;
  session.color = hex;
  store.set(KEY_COLOR, hex);
  renderSwatches();
  renderBubble();
}

function cooldownLeft() {
  return Math.max(0, session.cooldownUntil - Date.now());
}

function updateSendButton() {
  const left = cooldownLeft();
  const empty = !els.msg.value.replace(/\s+/g, ' ').trim();
  els.sendBtn.disabled = session.banned || session.sending || !session.joined || empty || left > 0;
  els.sendBtn.textContent = left > 0 ? 'Tunggu ' + Math.ceil(left / 1000) + 's' : 'Kirim';
}

function startCooldown(ms) {
  session.cooldownUntil = Date.now() + ms;
  clearInterval(session.cooldownTimer);
  session.cooldownTimer = setInterval(() => {
    if (cooldownLeft() === 0) clearInterval(session.cooldownTimer);
    updateSendButton();
  }, 250);
  updateSendButton();
}

function handleInput() {
  const trimmed = limit(els.msg.value, MAX_TEXT);
  if (trimmed !== els.msg.value) els.msg.value = trimmed;
  const length = Array.from(trimmed).length;
  els.count.textContent = length + '/' + MAX_TEXT;
  els.count.classList.toggle('warn', length >= MAX_TEXT - 10);
  renderBubble();
  updateSendButton();
}

function transmit(payload) {
  if (!session.open || !session.socket) return false;
  session.socket.send(JSON.stringify(payload));
  return true;
}

function joinRoom() {
  if (!session.nickname) return;
  transmit({ type: 'join', deviceId: session.deviceId, nickname: session.nickname });
}

function applyBan() {
  session.banned = true;
  clearTimeout(session.retryTimer);
  showScreen('banned');
  if (session.socket) session.socket.close();
}

function finishSend() {
  clearTimeout(session.sendTimer);
  session.sending = false;
  updateSendButton();
}

function onServerMessage(data) {
  switch (data.type) {
    case 'joined':
      session.joined = true;
      if (data.banned) applyBan();
      else updateSendButton();
      break;
    case 'chat:ack':
      els.msg.value = '';
      handleInput();
      finishSend();
      startCooldown(3000);
      toast(data.mode === 'manual' ? 'Terkirim. Menunggu persetujuan moderator.' : 'Pesan terkirim ke layar!');
      break;
    case 'banned':
      applyBan();
      break;
    case 'error':
      if (data.code === 'rate_limited') {
        finishSend();
        startCooldown(Number(data.retryMs) || 3000);
      } else if (data.code === 'invalid_join') {
        showScreen('join');
      }
      toast(data.message || 'Terjadi kesalahan.');
      break;
    default:
      break;
  }
}

function scheduleReconnect() {
  if (session.banned || document.hidden) return;
  clearTimeout(session.retryTimer);
  const delay = Math.min(8000, 1000 * Math.pow(2, session.retry)) + Math.random() * 500;
  session.retry += 1;
  session.retryTimer = setTimeout(connect, delay);
}

function connect() {
  if (session.banned) return;
  const current = session.socket;
  if (current && (current.readyState === WebSocket.CONNECTING || current.readyState === WebSocket.OPEN)) return;
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(scheme + '://' + location.host + '/ws?role=audience');
  session.socket = ws;

  ws.onopen = () => {
    session.open = true;
    session.retry = 0;
    setStatus(true);
    joinRoom();
  };
  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (err) { return; }
    if (data && typeof data.type === 'string') onServerMessage(data);
  };
  ws.onclose = () => {
    if (session.socket !== ws) return;
    session.open = false;
    session.joined = false;
    setStatus(false);
    finishSend();
    scheduleReconnect();
  };
  ws.onerror = () => {
    try { ws.close(); } catch (err) {}
  };
}

function enterChat() {
  els.whoName.textContent = session.nickname;
  showScreen('chat');
  renderBubble();
  updateSendButton();
}

function submitNickname() {
  const nick = limit(els.nickInput.value.replace(/\s+/g, ' ').trim(), MAX_NICK);
  if (!nick) {
    toast('Isi nickname dulu ya.');
    els.nickInput.focus();
    return;
  }
  session.nickname = nick;
  store.set(KEY_NICK, nick);
  enterChat();
  if (session.open) joinRoom();
  else connect();
}

function changeNickname() {
  showScreen('join');
}

function sendChat() {
  if (session.banned || session.sending || cooldownLeft() > 0) return;
  const text = limit(els.msg.value.replace(/\s+/g, ' ').trim(), MAX_TEXT);
  if (!text) return;
  if (!session.joined) {
    toast('Belum terhubung. Coba lagi sebentar.');
    return;
  }
  session.sending = true;
  updateSendButton();
  if (!transmit({ type: 'chat', text, color: session.color })) {
    finishSend();
    toast('Koneksi terputus. Menyambung ulang…');
    return;
  }
  session.sendTimer = setTimeout(finishSend, SEND_TIMEOUT_MS);
}

function sendEmote(emoji, button) {
  if (session.banned || !session.joined) return;
  const now = Date.now();
  if (now - session.lastEmote < EMOTE_GAP_MS) return;
  session.lastEmote = now;
  transmit({ type: 'emote', emoji });
  if (button && navigator.vibrate) navigator.vibrate(8);
}

els.nickInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') submitNickname();
});

els.msg.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendChat();
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden || session.banned || !session.nickname) return;
  clearTimeout(session.retryTimer);
  session.retry = 0;
  connect();
});

(function init() {
  let device = store.get(KEY_DEVICE);
  if (!device) {
    device = createDeviceId();
    store.set(KEY_DEVICE, device);
  }
  session.deviceId = device;

  const savedColor = store.get(KEY_COLOR);
  if (savedColor && COLORS.indexOf(savedColor) !== -1) session.color = savedColor;

  buildSwatches();
  renderSwatches();
  setStatus(false);

  const savedNick = store.get(KEY_NICK);
  if (savedNick) {
    session.nickname = limit(savedNick, MAX_NICK);
    enterChat();
    connect();
  } else {
    showScreen('join');
  }
})();
</script>
</body>
</html>
