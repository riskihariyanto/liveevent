<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Moderasi</title>
<style>
:root {
  --bg: #0b0d12;
  --panel: #151922;
  --panel-2: #1b2130;
  --line: #262d3f;
  --text: #f2f4f8;
  --muted: #8b93a7;
  --accent: #3b82f6;
  --ok: #22c55e;
  --danger: #ef4444;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.hidden { display: none !important; }

#login {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg);
}
.login-box {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.login-box h1 { margin: 0; font-size: 1.5rem; }
.login-box p { margin: 0; color: var(--muted); min-height: 1.2em; }
.login-box p.error { color: var(--danger); }
.field {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: none;
}
.field:focus { border-color: var(--accent); }
.primary { background: var(--accent); color: #fff; }

#console {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 20px;
  padding: 12px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.bar h1 { margin: 0; font-size: 1.1rem; }
.status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
.dot.on { background: var(--ok); }
.grow { flex: 1; }
.modes { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.modes button { background: transparent; color: var(--muted); padding: 8px 14px; }
.modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }

.layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);
  gap: 16px;
  padding: 16px;
}
.col { min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.card {
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
}
.card.fill { flex: 1; }
.card header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-weight: 700;
}
.card header small { color: var(--muted); font-weight: 500; }
.badge { min-width: 26px; padding: 2px 9px; text-align: center; background: var(--accent); border-radius: 99px; font-size: 0.85rem; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.empty { margin: auto; padding: 24px; text-align: center; color: var(--muted); line-height: 1.5; }

.item { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--panel-2); border: 1px solid transparent; border-radius: 14px; }
.item.first { border-color: var(--accent); }
.bubble { padding: 8px 14px; border-radius: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.bubble b { display: block; font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; }
.meta { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .approve { flex: 1; background: var(--ok); color: #04140a; }
.actions .reject { flex: 1; background: #2a3145; }
.actions .ban { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--panel-2); border-radius: 12px; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .id { color: var(--muted); font-size: 0.75rem; }
.row button { background: #2a3145; padding: 8px 12px; flex: none; }

.words { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.words textarea { min-height: 140px; resize: vertical; }
.hint { padding: 0 14px 12px; color: var(--muted); font-size: 0.8rem; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  transform: translate(-50%, 16px);
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  background: #222a3d;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 0.9rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 30;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  html, body { height: auto; }
  #console { height: auto; min-height: 100%; }
  .layout { grid-template-columns: 1fr; }
  .card.fill .scroll { max-height: 60vh; }
}
</style>
</head>
<body>
<section id="login">
  <div class="login-box">
    <h1>Panel Moderasi</h1>
    <p id="loginMsg">Masukkan password admin.</p>
    <input id="passInput" class="field" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password admin">
    <button class="primary" onclick="submitLogin()">Masuk</button>
  </div>
</section>

<main id="console">
  <div class="bar">
    <h1>Moderasi</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="online">0 terhubung</span></div>
    <div class="grow"></div>
    <div class="modes" role="group" aria-label="Mode moderasi">
      <button id="modeAuto" onclick="setMode('auto')" aria-pressed="true">Otomatis</button>
      <button id="modeManual" onclick="setMode('manual')" aria-pressed="false">Manual</button>
    </div>
  </div>

  <div class="layout">
    <div class="col">
      <section class="card fill">
        <header>
          <span>Antrean persetujuan <small>A setujui · R tolak (teratas)</small></span>
          <span id="pendingCount" class="badge">0</span>
        </header>
        <div id="queue" class="scroll"></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <header><span>Filter kata</span><small id="wordCount">0 kata</small></header>
        <div class="words">
          <textarea id="words" class="field" placeholder="Satu kata per baris" aria-label="Daftar kata terlarang" oninput="markWordsDirty()"></textarea>
          <button class="primary" onclick="saveWords()">Simpan daftar</button>
        </div>
        <div class="hint">Kata yang cocok diganti *** pada pesan dan nickname.</div>
      </section>

      <section class="card fill">
        <header><span>Perangkat diblokir</span><span id="banCount" class="badge">0</span></header>
        <div id="banned" class="scroll"></div>
      </section>
    </div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const KEY_PASS = 'lec.admin';
const HEX_COLOR = /^#[0-9a-f]{6}$/i;
const BASE_TITLE = 'Moderasi';

const store = {
  get(key) {
    try { return sessionStorage.getItem(key); } catch (err) { return null; }
  },
  set(key, value) {
    try { sessionStorage.setItem(key, value); } catch (err) {}
  },
  remove(key) {
    try { sessionStorage.removeItem(key); } catch (err) {}
  }
};

const app = {
  socket: null,
  open: false,
  authed: false,
  password: store.get(KEY_PASS) || '',
  retry: 0,
  retryTimer: 0,
  toastTimer: 0,
  mode: 'auto',
  items: new Map(),
  nodes: new Map(),
  wordsDirty: false
};

const els = {
  login: document.getElementById('login'),
  loginMsg: document.getElementById('loginMsg'),
  passInput: document.getElementById('passInput'),
  dot: document.getElementById('dot'),
  online: document.getElementById('online'),
  modeAuto: document.getElementById('modeAuto'),
  modeManual: document.getElementById('modeManual'),
  queue: document.getElementById('queue'),
  pendingCount: document.getElementById('pendingCount'),
  words: document.getElementById('words'),
  wordCount: document.getElementById('wordCount'),
  banned: document.getElementById('banned'),
  banCount: document.getElementById('banCount'),
  toast: document.getElementById('toast')
};

function textOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0b0d12' : '#ffffff';
}

function toast(message) {
  els.toast.textContent = message;
  els.toast.classList.add('show');
  clearTimeout(app.toastTimer);
  app.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
}

function transmit(payload) {
  if (!app.open || !app.socket) return false;
  app.socket.send(JSON.stringify(payload));
  return true;
}

function showLogin(message, isError) {
  els.login.classList.remove('hidden');
  els.loginMsg.textContent = message;
  els.loginMsg.classList.toggle('error', Boolean(isError));
  els.passInput.focus();
}

function setStatus(online) {
  els.dot.classList.toggle('on', online);
  els.dot.title = online ? 'Terhubung' : 'Menyambung ulang…';
}

function emptyNote(text) {
  const note = document.createElement('div');
  note.className = 'empty';
  note.textContent = text;
  return note;
}

function renderMode() {
  els.modeAuto.setAttribute('aria-pressed', String(app.mode === 'auto'));
  els.modeManual.setAttribute('aria-pressed', String(app.mode === 'manual'));
  renderQueueEmpty();
}

function renderQueueEmpty() {
  const existing = els.queue.querySelector('.empty');
  if (existing) existing.remove();
  if (app.nodes.size) return;
  els.queue.appendChild(emptyNote(app.mode === 'auto'
    ? 'Mode otomatis aktif. Pesan tayang langsung setelah disaring filter kata.'
    : 'Antrean kosong. Pesan baru akan muncul di sini.'));
}

function refreshQueueMeta() {
  const count = app.nodes.size;
  els.pendingCount.textContent = String(count);
  document.title = (count ? '(' + count + ') ' : '') + BASE_TITLE;
  let first = true;
  els.queue.querySelectorAll('.item').forEach((node) => {
    node.classList.toggle('first', first);
    first = false;
  });
  renderQueueEmpty();
}

function buildItem(item) {
  const node = document.createElement('div');
  node.className = 'item';
  node.dataset.id = item.id;

  const color = HEX_COLOR.test(item.color) ? item.color : '#3b82f6';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.backgroundColor = color;
  bubble.style.color = textOn(color);
  const who = document.createElement('b');
  who.textContent = item.nickname;
  const text = document.createElement('span');
  text.textContent = item.text;
  bubble.appendChild(who);
  bubble.appendChild(text);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = new Date(item.ts).toLocaleTimeString('id-ID', { hour12: false }) + ' · ' + String(item.deviceId).slice(0, 8);

  const actions = document.createElement('div');
  actions.className = 'actions';
  [['approve', 'Setujui'], ['reject', 'Tolak'], ['ban', 'Blokir']].forEach(([action, label]) => {
    const button = document.createElement('button');
    button.className = action;
    button.dataset.action = action;
    button.textContent = label;
    actions.appendChild(button);
  });

  node.appendChild(bubble);
  node.appendChild(meta);
  node.appendChild(actions);
  return node;
}

function addItem(item) {
  if (!item || typeof item.id !== 'string' || app.nodes.has(item.id)) return;
  app.items.set(item.id, item);
  const node = buildItem(item);
  app.nodes.set(item.id, node);
  els.queue.appendChild(node);
}

function removeItem(id) {
  const node = app.nodes.get(id);
  if (node) node.remove();
  app.nodes.delete(id);
  app.items.delete(id);
}

function resetQueue(items) {
  app.items.clear();
  app.nodes.clear();
  els.queue.innerHTML = '';
  (Array.isArray(items) ? items : []).forEach(addItem);
  refreshQueueMeta();
}

function renderBanned(list) {
  els.banned.innerHTML = '';
  const entries = Array.isArray(list) ? list : [];
  els.banCount.textContent = String(entries.length);
  if (!entries.length) {
    els.banned.appendChild(emptyNote('Belum ada perangkat yang diblokir.'));
    return;
  }
  entries.forEach((entry) => {
    const row = document.createElement('div');
    row.className = 'row';
    const info = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = entry.nickname || 'Tanpa nama';
    const id = document.createElement('div');
    id.className = 'id';
    id.textContent = String(entry.deviceId).slice(0, 12);
    info.appendChild(name);
    info.appendChild(id);
    const button = document.createElement('button');
    button.dataset.action = 'unban';
    button.dataset.device = entry.deviceId;
    button.textContent = 'Buka blokir';
    row.appendChild(info);
    row.appendChild(button);
    els.banned.appendChild(row);
  });
}

function renderWords(list) {
  const words = Array.isArray(list) ? list : [];
  els.wordCount.textContent = words.length + ' kata';
  if (app.wordsDirty || document.activeElement === els.words) return;
  els.words.value = words.join('\n');
}

function renderState(data) {
  app.mode = data.mode === 'manual' ? 'manual' : 'auto';
  els.online.textContent = (Number.isFinite(data.onlineCount) ? data.onlineCount : 0) + ' terhubung';
  renderMode();
  renderBanned(data.banned);
  renderWords(data.words);
}

function onServerMessage(data) {
  switch (data.type) {
    case 'admin:auth':
      if (data.ok) {
        app.authed = true;
        els.login.classList.add('hidden');
      } else {
        app.authed = false;
        app.password = '';
        store.remove(KEY_PASS);
        showLogin('Password salah. Coba lagi.', true);
      }
      break;
    case 'state':
      renderState(data);
      break;
    case 'queue:snapshot':
      resetQueue(data.items);
      break;
    case 'queue:add':
      addItem(data);
      refreshQueueMeta();
      break;
    case 'queue:remove':
      removeItem(data.id);
      refreshQueueMeta();
      break;
    case 'error':
      if (data.code === 'unauthorized') showLogin('Sesi berakhir. Masuk lagi.', true);
      else toast(data.message || 'Terjadi kesalahan.');
      break;
    default:
      break;
  }
}

function authenticate() {
  if (!app.password) return;
  transmit({ type: 'admin:auth', password: app.password });
}

function scheduleReconnect() {
  clearTimeout(app.retryTimer);
  const delay = Math.min(6000, 800 * Math.pow(2, app.retry)) + Math.random() * 400;
  app.retry += 1;
  app.retryTimer = setTimeout(connect, delay);
}

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(scheme + '://' + location.host + '/ws?role=admin');
  app.socket = ws;

  ws.onopen = () => {
    app.open = true;
    app.retry = 0;
    setStatus(true);
    authenticate();
  };
  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (err) { return; }
    if (data && typeof data.type === 'string') onServerMessage(data);
  };
  ws.onclose = (event) => {
    if (app.socket !== ws) return;
    app.open = false;
    app.authed = false;
    setStatus(false);
    if (event.code === 1008) {
      app.password = '';
      store.remove(KEY_PASS);
      showLogin('Terlalu banyak percobaan. Muat ulang halaman.', true);
      return;
    }
    scheduleReconnect();
  };
  ws.onerror = () => {
    try { ws.close(); } catch (err) {}
  };
}

function submitLogin() {
  const value = els.passInput.value;
  if (!value) {
    showLogin('Password tidak boleh kosong.', true);
    return;
  }
  app.password = value;
  store.set(KEY_PASS, value);
  els.passInput.value = '';
  els.loginMsg.textContent = 'Memeriksa…';
  els.loginMsg.classList.remove('error');
  if (app.open) authenticate();
}

function setMode(mode) {
  if (!transmit({ type: 'admin:mode', mode })) toast('Belum terhubung.');
}

function approveItem(id) {
  transmit({ type: 'admin:approve', id });
}

function rejectItem(id) {
  transmit({ type: 'admin:reject', id });
}

function banSender(id) {
  const item = app.items.get(id);
  if (!item) return;
  if (!window.confirm('Blokir perangkat milik "' + item.nickname + '" selama acara?')) return;
  transmit({ type: 'admin:ban', deviceId: item.deviceId });
}

function unbanDevice(deviceId) {
  transmit({ type: 'admin:unban', deviceId });
}

function markWordsDirty() {
  app.wordsDirty = true;
}

function saveWords() {
  const list = els.words.value.split(/[\n,]+/).map((word) => word.trim()).filter(Boolean);
  if (!transmit({ type: 'admin:words', list })) {
    toast('Belum terhubung.');
    return;
  }
  app.wordsDirty = false;
  toast('Daftar kata disimpan.');
}

function firstItemId() {
  const first = els.queue.querySelector('.item');
  return first ? first.dataset.id : null;
}

els.queue.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const node = button.closest('.item');
  if (!node) return;
  const id = node.dataset.id;
  if (button.dataset.action === 'approve') approveItem(id);
  else if (button.dataset.action === 'reject') rejectItem(id);
  else if (button.dataset.action === 'ban') banSender(id);
});

els.banned.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-action="unban"]');
  if (button) unbanDevice(button.dataset.device);
});

els.passInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') submitLogin();
});

document.addEventListener('keydown', (event) => {
  if (!app.authed || event.metaKey || event.ctrlKey || event.altKey) return;
  const tag = event.target && event.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const id = firstItemId();
  if (!id) return;
  if (event.key === 'a' || event.key === 'A') approveItem(id);
  else if (event.key === 'r' || event.key === 'R') rejectItem(id);
});

renderMode();
renderBanned([]);
setStatus(false);
if (app.password) els.loginMsg.textContent = 'Memeriksa…';
else showLogin('Masukkan password admin.', false);
connect();
</script>
</body>
</html>
