<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Live Wall</title>
<style>
:root {
  --bg: #05060a;
  --text: #ffffff;
  --muted: #aab2c5;
  --accent: #38bdf8;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
body.idle { cursor: none; }

#stage {
  position: relative;
  display: flex;
  width: 100%;
  height: 100%;
  padding: 2.4vh 2vw;
  gap: 2vw;
}

#wall {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.feed {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 1.6vh;
  height: 100%;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 22%);
}

.card {
  flex: none;
  align-self: flex-start;
  max-width: 94%;
  padding: 1.6vh 2vw;
  border-radius: 2.4vh;
  box-shadow: 0 0.6vh 2vh rgba(0, 0, 0, 0.5);
  animation: rise 0.35s ease-out;
}
.card.leave { animation: fall 0.4s ease-in forwards; }
.card .who {
  display: block;
  margin-bottom: 0.4vh;
  font-size: clamp(1rem, 1.5vw, 2rem);
  font-weight: 700;
  opacity: 0.85;
}
.card .text {
  display: block;
  font-size: clamp(1.6rem, 3vw, 4rem);
  font-weight: 700;
  line-height: 1.2;
  overflow-wrap: anywhere;
}

.hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4vw;
  font-size: clamp(2rem, 4.2vw, 5.5rem);
  font-weight: 800;
  line-height: 1.2;
  color: var(--muted);
  transition: opacity 0.4s ease;
}
.hint strong { color: var(--accent); }
.hint.gone { opacity: 0; pointer-events: none; }

#side {
  flex: none;
  width: max(24vw, 260px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2vh;
  padding: 2.4vh 1.4vw;
  background: #0d1018;
  border: 2px solid #1c2233;
  border-radius: 3vh;
  text-align: center;
}
#qr {
  padding: 1.4vh;
  background: #fff;
  border-radius: 2vh;
  line-height: 0;
}
#qr img, #qr canvas { display: block; }
.cta { margin: 0; font-size: clamp(1.1rem, 1.9vw, 2.6rem); font-weight: 800; line-height: 1.2; }
.url {
  margin: 0;
  max-width: 100%;
  font-size: clamp(0.8rem, 1.1vw, 1.5rem);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.online { margin: 0; font-size: clamp(1rem, 1.5vw, 2rem); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

#sky {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 5;
}
.floater {
  position: absolute;
  bottom: -12vh;
  line-height: 1;
  will-change: transform, opacity;
  animation-name: float;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

.offline {
  position: absolute;
  top: 1.6vh;
  left: 50%;
  transform: translateX(-50%);
  padding: 0.8vh 1.6vw;
  background: #b91c1c;
  border-radius: 99px;
  font-size: clamp(0.9rem, 1.2vw, 1.6rem);
  font-weight: 700;
  z-index: 10;
}
.hidden { display: none; }

@keyframes rise {
  from { opacity: 0; transform: translateY(5vh) scale(0.96); }
  to { opacity: 1; transform: none; }
}
@keyframes fall {
  to { opacity: 0; transform: translateY(-3vh) scale(0.97); }
}
@keyframes float {
  0% { opacity: 0; transform: translate3d(0, 0, 0) rotate(0deg) scale(0.6); }
  10% { opacity: 1; transform: translate3d(calc(var(--dx) * 0.1), -12vh, 0) rotate(calc(var(--rot) * 0.2)) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate3d(var(--dx), -118vh, 0) rotate(var(--rot)) scale(1.1); }
}

@media (max-aspect-ratio: 1/1) {
  #stage { flex-direction: column; }
  #side { width: 100%; flex-direction: row; justify-content: space-around; }
}
</style>
</head>
<body>
<main id="stage">
  <section id="wall">
    <div id="hint" class="hint">Scan QR di samping,<br><strong>kirim pesan &amp; reaksimu!</strong></div>
    <div id="feed" class="feed"></div>
  </section>
  <aside id="side">
    <div id="qr"></div>
    <p class="cta">Scan &amp; ikut meramaikan</p>
    <p id="url" class="url"></p>
    <p id="online" class="online"></p>
  </aside>
  <div id="sky"></div>
  <div id="offline" class="offline hidden">Menyambung ulang…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
'use strict';

const MAX_VISIBLE = 8;
const CARD_TTL_MS = 40000;
const DRAIN_MS = 333;
const QUEUE_MAX = 100;
const MAX_FLOATERS = 60;
const EMOTE_PER_BATCH = 10;
const HEX_COLOR = /^#[0-9a-f]{6}$/i;

const els = {
  feed: document.getElementById('feed'),
  hint: document.getElementById('hint'),
  qr: document.getElementById('qr'),
  url: document.getElementById('url'),
  online: document.getElementById('online'),
  sky: document.getElementById('sky'),
  offline: document.getElementById('offline')
};

const runtime = {
  socket: null,
  retry: 0,
  retryTimer: 0,
  queue: [],
  cards: [],
  floaters: 0,
  idleTimer: 0,
  resizeTimer: 0,
  wakeLock: null
};

const audienceUrl = (function resolveAudienceUrl() {
  const custom = new URLSearchParams(location.search).get('url');
  return custom || location.origin + '/';
})();

function textOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#0b0d12' : '#ffffff';
}

function renderQr() {
  const size = Math.round(Math.max(120, Math.min(window.innerWidth * 0.17, window.innerHeight * 0.42)));
  els.qr.innerHTML = '';
  els.url.textContent = audienceUrl.replace(/^https?:\/\//, '');
  if (typeof QRCode === 'undefined') return;
  new QRCode(els.qr, {
    text: audienceUrl,
    width: size,
    height: size,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function updateHint() {
  els.hint.classList.toggle('gone', runtime.cards.length > 0);
}

function dismissCard(entry) {
  const index = runtime.cards.indexOf(entry);
  if (index === -1) return;
  runtime.cards.splice(index, 1);
  entry.el.classList.add('leave');
  setTimeout(() => {
    entry.el.remove();
    updateHint();
  }, 400);
}

function addCard(data) {
  const el = document.createElement('div');
  el.className = 'card';
  const color = HEX_COLOR.test(data.color) ? data.color : '#3b82f6';
  el.style.backgroundColor = color;
  el.style.color = textOn(color);

  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = data.nickname;

  const text = document.createElement('span');
  text.className = 'text';
  text.textContent = data.text;

  el.appendChild(who);
  el.appendChild(text);
  els.feed.appendChild(el);

  const entry = { el, born: Date.now() };
  runtime.cards.push(entry);
  while (runtime.cards.length > MAX_VISIBLE) dismissCard(runtime.cards[0]);
  updateHint();
}

function drainQueue() {
  if (!runtime.queue.length) return;
  const count = Math.min(runtime.queue.length, runtime.queue.length > 20 ? 2 : 1);
  for (let i = 0; i < count; i += 1) addCard(runtime.queue.shift());
}

function expireCards() {
  const cutoff = Date.now() - CARD_TTL_MS;
  runtime.cards.slice().forEach((entry) => {
    if (entry.born < cutoff) dismissCard(entry);
  });
}

function enqueueChat(data) {
  if (typeof data.text !== 'string' || typeof data.nickname !== 'string') return;
  runtime.queue.push({ nickname: data.nickname, text: data.text, color: data.color });
  while (runtime.queue.length > QUEUE_MAX) runtime.queue.shift();
}

function launchEmote(emoji) {
  if (runtime.floaters >= MAX_FLOATERS) return;
  const duration = 3.2 + Math.random() * 2.4;
  const el = document.createElement('span');
  el.className = 'floater';
  el.textContent = emoji;
  el.style.left = 4 + Math.random() * 90 + 'vw';
  el.style.fontSize = 5 + Math.random() * 5 + 'vh';
  el.style.animationDuration = duration + 's';
  el.style.setProperty('--dx', Math.random() * 16 - 8 + 'vw');
  el.style.setProperty('--rot', Math.random() * 50 - 25 + 'deg');

  let released = false;
  const release = () => {
    if (released) return;
    released = true;
    el.remove();
    runtime.floaters -= 1;
  };
  el.addEventListener('animationend', release);
  setTimeout(release, duration * 1000 + 800);

  els.sky.appendChild(el);
  runtime.floaters += 1;
}

function spawnEmotes(counts) {
  if (!counts || typeof counts !== 'object') return;
  Object.keys(counts).forEach((emoji) => {
    if (typeof emoji !== 'string' || emoji.length > 8) return;
    const total = Math.min(Math.floor(Number(counts[emoji])) || 0, EMOTE_PER_BATCH);
    for (let i = 0; i < total; i += 1) {
      setTimeout(() => launchEmote(emoji), Math.random() * 180);
    }
  });
}

function onServerMessage(data) {
  switch (data.type) {
    case 'chat:new':
      enqueueChat(data);
      break;
    case 'emote:batch':
      spawnEmotes(data.counts);
      break;
    case 'state':
      els.online.textContent = Number.isFinite(data.onlineCount) ? data.onlineCount + ' terhubung' : '';
      break;
    default:
      break;
  }
}

function scheduleReconnect() {
  clearTimeout(runtime.retryTimer);
  const delay = Math.min(5000, 800 * Math.pow(2, runtime.retry)) + Math.random() * 400;
  runtime.retry += 1;
  runtime.retryTimer = setTimeout(connect, delay);
}

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(scheme + '://' + location.host + '/ws?role=stage');
  runtime.socket = ws;

  ws.onopen = () => {
    runtime.retry = 0;
    els.offline.classList.add('hidden');
  };
  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (err) { return; }
    if (data && typeof data.type === 'string') onServerMessage(data);
  };
  ws.onclose = () => {
    if (runtime.socket !== ws) return;
    els.offline.classList.remove('hidden');
    scheduleReconnect();
  };
  ws.onerror = () => {
    try { ws.close(); } catch (err) {}
  };
}

function toggleFullscreen() {
  if (document.fullscreenElement) {
    document.exitFullscreen();
    return;
  }
  const root = document.documentElement;
  if (root.requestFullscreen) root.requestFullscreen().catch(() => {});
}

function requestWakeLock() {
  if (!navigator.wakeLock || document.hidden) return;
  navigator.wakeLock.request('screen').then((lock) => {
    runtime.wakeLock = lock;
  }).catch(() => {});
}

function wakeCursor() {
  document.body.classList.remove('idle');
  clearTimeout(runtime.idleTimer);
  runtime.idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}

window.addEventListener('resize', () => {
  clearTimeout(runtime.resizeTimer);
  runtime.resizeTimer = setTimeout(renderQr, 250);
});
document.addEventListener('mousemove', wakeCursor);
document.addEventListener('dblclick', toggleFullscreen);
document.addEventListener('keydown', (event) => {
  if (event.key === 'f' || event.key === 'F') toggleFullscreen();
});
document.addEventListener('visibilitychange', requestWakeLock);

renderQr();
connect();
requestWakeLock();
wakeCursor();
setInterval(drainQueue, DRAIN_MS);
setInterval(expireCards, 2000);
</script>
</body>
</html>
